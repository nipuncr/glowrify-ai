services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - '127.0.0.1:8000:8000'
    restart: unless-stopped
    mem_limit: 3g
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'
    restart: unless-stopped
