limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 9m;
 client_body_timeout 20s;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
 location /api/ {
  limit_req zone=api_limit burst=12 nodelay;
  limit_req_status 429;
  proxy_pass http://api:8000;
  proxy_read_timeout 125s;
  proxy_send_timeout 125s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location /_next/static/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
 }
 location / { try_files $uri $uri.html $uri/ =404; }
}
